; OneMenu driven through the Arduino_GFX HAPI adapters' I2C bus
; (hapi_gfx::Arduino_Wire_HAPI, hosted in OneIO's own
; include/oneIO/display/arduinoGfx/ -- see that directory's README.md) and
; OneIO's existing Ssd1306<> driver, bridged via
; oneIO/display/arduinoGfx/ArduinoGfxHapiSsd1306.h. Real hardware target: any
; ESP32 devkit + SSD1306 128x64 I2C OLED wired to the default I2C pins
; (SDA=21, SCL=22). Navigation over USB serial (arrow keys + Enter/Esc via a
; terminal that sends raw ANSI, e.g. `pio device monitor --raw`, or a serial
; menu tool).
;
; One thing needs staging locally (not committed -- see this repo's usual
; .gitignore for dotfiles):
;
; .libs/Arduino_GFX -- still needed transitively (Arduino_Wire_HAPI.h
; reuses GFX_NOT_DEFINED/TWI_BUFFER_LENGTH from Arduino_GFX's own
; Arduino_DataBus.h). PlatformIO's symlink:// lib_deps protocol doesn't
; reliably resolve Arduino-format libraries (library.properties + src/,
; no library.json) -- verified: it silently drops them from the actual
; compile flags with no error. lib_extra_dirs + a real local library.json
; does work:
;   mkdir -p .libs/Arduino_GFX
;   ln -s /path/to/Arduino_GFX/library.properties .libs/Arduino_GFX/library.properties
;   ln -s /path/to/Arduino_GFX/src               .libs/Arduino_GFX/src
;   printf '{"name":"GFX Library for Arduino","version":"1.6.7","build":{"srcFilter":["+<*>","-<Arduino_GFX_Library.cpp>","-<databus/Arduino_ESP32SPI.cpp>","-<databus/Arduino_ESP32SPIDMA.cpp>"]}}' > .libs/Arduino_GFX/library.json
; (the srcFilter exclusions dodge an unrelated espressif32-platform gap --
; Arduino_ESP32SPI.h needs esp32-hal-periman.h, missing from every
; espressif32 version checked up to 7.0.1 -- see Arduino_GFX/bench/README.md)
;
[env:esp32]
platform  = espressif32@5.4.0
board     = esp32dev
framework = arduino
lib_ldf_mode = deep+
lib_extra_dirs = .libs
; Local source tree, not GitHub -- matches every other example in this
; repo, so in-tree library fixes (e.g. OneMenu's TreeNav<>) are actually
; picked up instead of a stale published copy.
lib_deps =
    HAPI      = symlink://../../../HAPI
    OneBit    = symlink://../../../OneBit
    OnePin    = symlink://../../../OnePin
    OneBus    = symlink://../../../OneBus
    OneChip   = symlink://../../../OneChip
    OneData   = symlink://../../../OneData
    OneOutput = symlink://../../../OneOutput
    OneItem   = symlink://../../../OneItem
    OneParse  = symlink://../../../OneParse
    OneInput  = symlink://../../../OneInput
    OneMenu   = symlink://../../../OneMenu
upload_port   = /dev/ttyUSB0
monitor_port  = /dev/ttyUSB0
monitor_speed = 115200
build_unflags =
    -std=c++11 -std=c++14 -std=c++20 -std=c++2a
    -std=gnu++11 -std=gnu++14 -std=gnu++20 -std=gnu++2a -std=gnu++1z
; ESP32 Arduino framework uses ##__VA_ARGS__ GNU extension -- must use gnu++17, not c++17.
build_flags   = -std=gnu++17
