; OneMenu driven through the Arduino_GFX fork's HAPI-composed I2C bus
; (hapi_gfx::Arduino_Wire_HAPI) and OneIO's existing Ssd1306<> driver, bridged
; via this example's own src/gfxHapiTransport.h. Real hardware target: any ESP32
; devkit + SSD1306 128x64 I2C OLED wired to the default I2C pins (SDA=21,
; SCL=22). Navigation over USB serial (arrow keys + Enter/Esc via a terminal
; that sends raw ANSI, e.g. `pio device monitor --raw`, or a serial menu tool).
;
; .libs/Arduino_GFX must exist locally (not committed -- see this repo's usual
; .gitignore for dotfiles), staged like this (PlatformIO's symlink:// lib_deps
; protocol doesn't reliably resolve Arduino-format libraries -- library.properties
; + src/, no library.json -- verified: it silently drops them from the actual
; compile flags with no error. lib_extra_dirs + a real local library.json does
; work):
;   mkdir -p .libs/Arduino_GFX
;   ln -s /path/to/Arduino_GFX/library.properties .libs/Arduino_GFX/library.properties
;   ln -s /path/to/Arduino_GFX/src               .libs/Arduino_GFX/src
;   printf '{"name":"GFX Library for Arduino","version":"1.6.7"}' > .libs/Arduino_GFX/library.json
[env:esp32]
platform  = espressif32@5.4.0
board     = esp32dev
framework = arduino
lib_ldf_mode = deep+
lib_extra_dirs = .libs
upload_port   = /dev/ttyUSB0
monitor_port  = /dev/ttyUSB0
monitor_speed = 115200
build_unflags =
    -std=c++11 -std=c++14 -std=c++20 -std=c++2a
    -std=gnu++11 -std=gnu++14 -std=gnu++20 -std=gnu++2a -std=gnu++1z
; ESP32 Arduino framework uses ##__VA_ARGS__ GNU extension -- must use gnu++17, not c++17.
build_flags   = -std=gnu++17
lib_deps =
    HAPI      = https://github.com/InternetOfPins/HAPI.git
    OneBit    = https://github.com/InternetOfPins/OneBit.git
    OnePin    = https://github.com/InternetOfPins/OnePin.git
    OneBus    = https://github.com/InternetOfPins/OneBus.git
    OneChip   = https://github.com/InternetOfPins/OneChip.git
    OneData   = https://github.com/InternetOfPins/OneData.git
    OneOutput = https://github.com/InternetOfPins/OneOutput.git
    OneItem   = https://github.com/InternetOfPins/OneItem.git
    OneParse  = https://github.com/InternetOfPins/OneParse.git
    OneMenu   = https://github.com/InternetOfPins/OneMenu.git
    OneIO     = https://github.com/InternetOfPins/OneIO.git
