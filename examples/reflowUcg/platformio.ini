; azoreanFlow building-block demo, Ucglib variant — same MAX31855 + ST7735 TFT +
; rotary encoder + OneMenu as OneIO/examples/reflowDemo, but the TFT is driven
; through Ucglib (oneIO/display/ucgSpi.h + OneIO/vendor/ucglib-core) instead of
; our hand-rolled st7735.h, so the curve plot gets real per-pixel RGB: reference
; curve and live trace in two distinct colours instead of one fg/bg byte.
;
; ucglib-core is a local trimmed vendor copy of olikraus/Ucglib (BSD-2-Clause) —
; same device drivers/draw primitives/fonts, minus the Arduino C++ wrapper
; (Ucglib.cpp), which won't compile without the Arduino framework. See
; OneIO/vendor/ucglib-core/library.json for details.
;
; Shared hardware SPI: MOSI=D11, SCK=D13, MISO=D12.
; TFT:      CS=D10, DC=D9, RST=D8.
; MAX31855: CS=D7.
; Encoder:  A=A0(PC0), B=A1(PC1), SW=A2(PC2) — PCINT1.
[platformio]
default_envs = avr

[common]
build_unflags =
    -std=c++11 -std=c++14 -std=c++20 -std=c++2a
    -std=gnu++11 -std=gnu++14 -std=gnu++20 -std=gnu++2a -std=gnu++1z
build_flags = -std=c++17
; Local source tree, not GitHub -- matches every other example in this
; repo (lib_extra_dirs = ../../..), so in-tree library fixes are actually
; picked up instead of a stale published copy. ucglib-core stays in
; lib_deps: it's a local vendor symlink, not a GitHub package.
lib_extra_dirs = ../../..
lib_deps =
    ucglib-core = symlink://../../vendor/ucglib-core

[env:avr]
platform = atmelavr@^4.0.0
board = uno
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 9600
build_unflags = ${common.build_unflags}
build_flags   = ${common.build_flags} -DIOP
lib_extra_dirs = ${common.lib_extra_dirs}
lib_deps      = ${common.lib_deps}
