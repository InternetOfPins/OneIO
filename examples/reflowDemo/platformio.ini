; IOP reflow-controller demo: MAX31855 thermocouple + ST7735 TFT + rotary encoder + OneMenu.
; azoreanFlow (https://github.com/neu-rah/azoreanFlow) building-block proof of concept.
;
; Shared hardware SPI: MOSI=D11, SCK=D13, MISO=D12.
; TFT:      CS=D10, DC=D9, RST=D8.
; MAX31855: CS=D7.
; Encoder:  A=A0(PC0), B=A1(PC1), SW=A2(PC2) — PCINT1.
;
; Menu picks a solder profile and starts the process; the running process
; takes the screen over to plot the profile curve + live thermocouple trace.
; Any button click/hold stops the process and returns to the menu.
[platformio]
default_envs = avr

[common]
build_unflags =
    -std=c++11 -std=c++14 -std=c++20 -std=c++2a
    -std=gnu++11 -std=gnu++14 -std=gnu++20 -std=gnu++2a -std=gnu++1z
build_flags = -std=c++17
; Local source tree, not GitHub -- matches every other example in this
; repo (lib_extra_dirs = ../../..), so in-tree library fixes are actually
; picked up instead of a stale published copy.
lib_extra_dirs = ../../..

[env:avr]
platform = atmelavr@^4.0.0
board = uno
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 9600
build_unflags = ${common.build_unflags}
build_flags   = ${common.build_flags} -DIOP
lib_extra_dirs = ${common.lib_extra_dirs}
