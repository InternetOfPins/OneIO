; IOP + u8g2 SPI SSD1306 demo — u8g2 as an alternate Transport (see oneIO/display/u8g2Spi.h).
; Uses u8g2_Setup_ssd1306_128x64_noname_1: 1-tile (8px-row) buffer, smallest RAM,
; most FirstPage/NextPage redraw passes — the extreme end of the RAM-for-CPU trade
; discussed for tile-buffered displays (AM4 precedent).
;
; Shared hardware SPI: MOSI=D11, SCK=D13. CS=D10, DC=D9, RST=D8.
; Encoder: A=A0(PC0), B=A1(PC1), SW=A2(PC2) — PCINT1.
[platformio]
default_envs = avr

[common]
build_unflags =
    -std=c++11 -std=c++14 -std=c++20 -std=c++2a
    -std=gnu++11 -std=gnu++14 -std=gnu++20 -std=gnu++2a -std=gnu++1z
build_flags = -std=c++17
; lib_ldf_mode=off needs every dependency spelled out explicitly (it does
; no #include scanning) -- kept as-is (was needed for U8g2's non-standard
; src/clib/*.h layout, which the default LDF modes fail to discover through
; OneIO's u8g2Spi.h). Only the protocol changed: symlink:// to the local
; checkout instead of a GitHub URL, so in-tree library fixes are actually
; picked up instead of a stale published copy.
lib_deps =
    HAPI      = symlink://../../../HAPI
    OneBit    = symlink://../../../OneBit
    OnePin    = symlink://../../../OnePin
    OneBus    = symlink://../../../OneBus
    OneChip   = symlink://../../../OneChip
    OneInput  = symlink://../../../OneInput
    OneData   = symlink://../../../OneData
    OneItem   = symlink://../../../OneItem
    OneOutput = symlink://../../../OneOutput
    OneMenu   = symlink://../../../OneMenu
    olikraus/U8g2 @ ^2.36.13

[env:avr]
platform = atmelavr@^4.0.0
board = uno
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 9600
build_unflags = ${common.build_unflags}
; This example lives inside OneIO's own tree, so OneIO's include/ is added
; directly (-I) instead of as a lib_deps entry -- `OneIO = symlink://../..`
; recurses into itself (into examples/, into the symlink, forever; see
; OneIO/examples/arduinoGfxMenu/platformio.ini for the same bug class).
build_flags   = ${common.build_flags} -DIOP -I../../include
lib_deps      = ${common.lib_deps}
lib_ldf_mode  = off
lib_compat_mode = off
