; IOP + u8g2 SPI SSD1306 demo — u8g2 as an alternate Transport (see oneIO/display/u8g2Spi.h).
; Uses u8g2_Setup_ssd1306_128x64_noname_1: 1-tile (8px-row) buffer, smallest RAM,
; most FirstPage/NextPage redraw passes — the extreme end of the RAM-for-CPU trade
; discussed for tile-buffered displays (AM4 precedent).
;
; Shared hardware SPI: MOSI=D11, SCK=D13. CS=D10, DC=D9, RST=D8.
; Encoder: A=A0(PC0), B=A1(PC1), SW=A2(PC2) — PCINT1.
[platformio]
default_envs = avr

[common]
build_unflags =
    -std=c++11 -std=c++14 -std=c++20 -std=c++2a
    -std=gnu++11 -std=gnu++14 -std=gnu++20 -std=gnu++2a -std=gnu++1z
build_flags = -std=c++17
lib_deps =
    HAPI      = https://github.com/InternetOfPins/HAPI.git@a7e32cb11fefa80e99174e8ccb9b571bac62f6e1
    OneBit    = https://github.com/InternetOfPins/OneBit.git@c57022267bf56fc0ffeb8c5aa7adc1e52eaf7ff1
    OnePin    = https://github.com/InternetOfPins/OnePin.git@67acf0658afc8699b0dd8c4591890b66ef2ce739
    OneBus    = https://github.com/InternetOfPins/OneBus.git@701171a9bdebdccb25f715f610e715b79b15c2e5
    OneChip   = https://github.com/InternetOfPins/OneChip.git@7bb584a12e261afe4e5f87c7f4e655ca998605e6
    OneInput  = https://github.com/InternetOfPins/OneInput.git@cfca07d2493b6a01bab333c34ee1f31e6b4da660
    OneData   = https://github.com/InternetOfPins/OneData.git@2b11f2c278779321e4fd3e0e49b5434cd20b7944
    OneItem   = https://github.com/InternetOfPins/OneItem.git@c8bb35d6f75307fc783dfd62680e2e771d1ecb06
    OneOutput = https://github.com/InternetOfPins/OneOutput.git@b67fd00146c0e4963d6054eb7629645764b91655
    OneMenu   = https://github.com/InternetOfPins/OneMenu.git@704b7fa44119286bdf0d8e95d0e50ee967d7f248
    OneIO     = https://github.com/InternetOfPins/OneIO.git@1795d1e12a1ca87d65dc8e5bc231c1daacc30e33
    olikraus/U8g2 @ ^2.36.13

[env:avr]
platform = atmelavr@^4.0.0
board = uno
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0
monitor_speed = 9600
build_unflags = ${common.build_unflags}
build_flags   = ${common.build_flags} -DIOP
lib_deps      = ${common.lib_deps}
lib_ldf_mode  = off
lib_compat_mode = off
