; IOP HD44780 I2C LCD example — PCF8574 backpack.
;   AVR:   SDA=A4, SCL=A5. Address 0x27 (A0-A2=000); -DLCD_ADDR=0x3F for PCF8574A.
;   STM32: SDA=PB7, SCL=PB6 (I2C1). Two clocks — 72 MHz (HSE x9) / 64 MHz (HSI/2 x16).
[platformio]
default_envs = avr

[common]
build_unflags =
    -std=c++11 -std=c++14
    -std=gnu++11 -std=gnu++14 -std=gnu++1z
build_flags = -std=c++17
; Local source tree, not GitHub -- matches every other example in this
; repo (lib_extra_dirs = ../../..), so in-tree library fixes are actually
; picked up instead of a stale published copy.
lib_extra_dirs = ../../..

[env:avr]
platform = atmelavr@^4.0.0
board = uno
upload_port   = /dev/ttyUSB0
monitor_port  = /dev/ttyUSB0
monitor_speed = 9600
build_unflags = ${common.build_unflags}
build_flags   = ${common.build_flags} -DIOP
lib_extra_dirs = ${common.lib_extra_dirs}

; Blue Pill — bare-metal CMSIS, 72 MHz PLL from the on-board HSE crystal
; (stm32f1_pll_72mhz() falls back to HSI if the crystal is absent).
[env:bluepill_72]
platform  = ststm32
board     = bluepill_f103c8
framework = cmsis
upload_protocol = stlink
debug_tool      = stlink
build_unflags = ${common.build_unflags}
build_flags   = ${common.build_flags} -DIOP -DSTM32F1xx -DIOP_CPU_HZ=72000000
lib_extra_dirs = ${common.lib_extra_dirs}

; Blue Pill — 64 MHz PLL from HSI/2 x16 (no crystal dependency). Mirrors
; what stm32f1xx-hal's sysclk(72.MHz()) actually delivers on HSI, so the
; Rust bridge round can reuse this exact clock/I2C configuration.
[env:bluepill_64]
platform  = ststm32
board     = bluepill_f103c8
framework = cmsis
upload_protocol = stlink
debug_tool      = stlink
build_unflags = ${common.build_unflags}
build_flags   = ${common.build_flags} -DIOP -DSTM32F1xx -DIOP_CPU_HZ=64000000
lib_extra_dirs = ${common.lib_extra_dirs}
